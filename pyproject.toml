[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tongs"
dynamic = ["version"]
description = "Multi-forge MR/CI management TUI for GitHub and GitLab"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andre Motta" },
]
keywords = ["tui", "git", "gitlab", "github", "merge-request", "pull-request", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "pyperclip>=1.8",
    "aiosqlite>=0.20",
    "packaging>=24.0",
    "sigstore>=4.5,<5",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
mcp = ["mcp[cli]>=1.0,<2"]
fleet = ["claude-fleet-monitor>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.18,<5",
    "mkdocs-material>=9.0",
    # Required by tests/ci/test_production_workflow_contract.py, which parses
    # the workflows to catch drift between them and the gate's constants.  It
    # must be a declared dependency rather than a transitive one, because a
    # skipped test would itself fail the gate's no-skip rule.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/andre-motta/tongs"
Documentation = "https://tongs.tools"
Repository = "https://github.com/andre-motta/tongs"
Issues = "https://github.com/andre-motta/tongs/issues"

[project.scripts]
tongs = "tongs.__main__:main"
tongs-mcp = "tongs.mcp.server:main"

[project.entry-points."tongs.plugins"]
mcp = "tongs.mcp.plugin:MCPPlugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/tongs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
