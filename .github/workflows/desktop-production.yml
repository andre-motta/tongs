name: Desktop production evidence

# Reusable production stages for the desktop pre-merge gate.
#
# Ordinary CI calls this workflow so the archive, installed core, SBOM and RPM
# lifecycle checks are mandatory instead of separately path filtered.  Every job
# checks out one exact revision, verifies HEAD and its tree, and publishes one
# issue #110 receipt whose identity the caller-owned aggregate validates
# independently.
#
# For a pull request that revision is GitHub's synthetic merge commit, because
# pre-merge combination testing is what gates integration.  The pull request
# head and base are recorded beside it as clearly named metadata; nothing here
# labels synthetic output as a contributor-head result.
#
# Nothing here signs anything: candidate signing stays in the trusted push
# workflow, and no headless job may satisfy the physical GPU gate owned by
# issue #55.

on:
  workflow_call:
    inputs:
      checked_out_sha:
        description: Exact revision every job must check out and bind
        required: true
        type: string
    outputs:
      job-results:
        description: Result of every production job, for the caller aggregate
        value: ${{ jobs.production-results.outputs.job-results }}
      source-tree:
        description: Tree of the exact checked-out source
        value: ${{ jobs.source-identity.outputs.tree }}
  workflow_dispatch:
    inputs:
      checked_out_sha:
        description: Exact revision every job must check out and bind
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PRODUCTION_ENVIRONMENT: github-hosted-ubuntu-24.04
  PRODUCTION_PROVENANCE: hosted
  NODE_OPTIONS: --max-old-space-size=512

jobs:
  source-identity:
    name: Exact production source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checked-out-commit: ${{ steps.identity.outputs.checked_out_commit }}
      tree: ${{ steps.identity.outputs.tree }}
      epoch: ${{ steps.identity.outputs.epoch }}
      source-archive-sha256: ${{ steps.identity.outputs.source_archive_sha256 }}
      event: ${{ steps.identity.outputs.event }}
      pull-request-head: ${{ steps.identity.outputs.pull_request_head }}
      pull-request-base: ${{ steps.identity.outputs.pull_request_base }}
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.checked_out_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the checked-out commit and record its pull request metadata
        id: identity
        env:
          PULL_REQUEST_HEAD: >-
            ${{ github.event.pull_request.head.sha || 'not-a-pull-request' }}
          PULL_REQUEST_BASE: >-
            ${{ github.event.pull_request.base.sha || 'not-a-pull-request' }}
        run: |
          set -euo pipefail
          checked_out_commit=$(git rev-parse HEAD)
          test "$checked_out_commit" = "${{ inputs.checked_out_sha }}"
          git diff --quiet
          git diff --cached --quiet
          tree=$(git rev-parse 'HEAD^{tree}')
          epoch=$(git show -s --format=%ct "$checked_out_commit")
          git archive --format=tar --output="$RUNNER_TEMP/source.tar" \
            "$checked_out_commit"
          digest=$(sha256sum "$RUNNER_TEMP/source.tar" | cut -d' ' -f1)
          # A pull request checks out the synthetic merge commit on purpose, so
          # the head must never be what was checked out.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$PULL_REQUEST_HEAD" != "$checked_out_commit"
          fi
          {
            printf 'checked_out_commit=%s\n' "$checked_out_commit"
            printf 'tree=%s\n' "$tree"
            printf 'epoch=%s\n' "$epoch"
            printf 'source_archive_sha256=%s\n' "$digest"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'pull_request_head=%s\n' "$PULL_REQUEST_HEAD"
            printf 'pull_request_base=%s\n' "$PULL_REQUEST_BASE"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'Checked out commit: %s\n\n' "$checked_out_commit"
            printf 'Checked out tree: %s\n\n' "$tree"
            printf 'Event: %s\n\n' "$GITHUB_EVENT_NAME"
            printf 'Pull request head: %s\n\n' "$PULL_REQUEST_HEAD"
            printf 'Pull request base: %s\n' "$PULL_REQUEST_BASE"
          } >> "$GITHUB_STEP_SUMMARY"

  native-payload:
    name: Native payload verifier fixture checks
    needs: [source-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECK_ID: desktop-native-payload-fixture
    steps:
      - name: Check out the exact head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source-identity.outputs.checked-out-commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the core and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the native payload verifier fixture checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          pytest tests/integration/desktop/test_native_payload_acceptance.py -v \
            --junitxml="$RUNNER_TEMP/reports/native-payload.junit.xml"
      - name: Describe the staged evidence for this check
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stage-plan.json" <<PLAN
          {
            "check_id": "$CHECK_ID",
            "report_path": "reports/native-payload-evidence.json",
            "source_context": {
              "event": "${{ needs.source-identity.outputs.event }}",
              "pull_request_head": "${{ needs.source-identity.outputs.pull-request-head }}",
              "pull_request_base": "${{ needs.source-identity.outputs.pull-request-base }}"
            },
            "scope": {
              "covered": "native-payload-verifier-structure-on-controlled-fixtures",
              "excluded": [
                "hardware-gpu-function",
                "installed-payload-observation",
                "physical-host-execution",
                "rpm-payload-layout"
              ]
            },
            "files": [
              {
                "kind": "report",
                "path": "reports/native-payload.junit.xml",
                "source": "$RUNNER_TEMP/reports/native-payload.junit.xml",
                "format": "pytest-junit"
              }
            ],
            "stages": [
              {
                "name": "verifier-fixture-structure-injected",
                "evidence": ["reports/native-payload.junit.xml"],
                "observation": {
                  "gpu_gate": "not-satisfied",
                  "gpu_gate_owner": "issue-55",
                  "runner": "headless-hosted"
                }
              }
            ],
            "equalities": [],
            "large_artifacts": []
          }
          PLAN
      - name: Publish the native payload fixture receipt
        run: >-
          python tests/ci/desktop_stage_receipt.py publish
          --source-root "$GITHUB_WORKSPACE"
          --plan "$RUNNER_TEMP/stage-plan.json"
          --output-root "$RUNNER_TEMP/gate/$CHECK_ID"
          --receipt-name native-payload-receipt.json
          --commit "${{ needs.source-identity.outputs.checked-out-commit }}"
          --tree "${{ needs.source-identity.outputs.tree }}"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --environment "$PRODUCTION_ENVIRONMENT"
          --provenance "$PRODUCTION_PROVENANCE"
          --check-id "$CHECK_ID"
          --format artifact-lifecycle-v1
          --format pytest-junit
      - name: Upload the native payload gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            gate-desktop-native-payload-fixture-${{
            needs.source-identity.outputs.checked-out-commit }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: ${{ runner.temp }}/gate/desktop-native-payload-fixture
          if-no-files-found: error
          retention-days: 14

  production-results:
    name: Publish production job results
    if: ${{ always() }}
    needs:
      - source-identity
      - native-payload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      job-results: ${{ steps.results.outputs.results }}
    env:
      PRODUCTION_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Forward the inner job results to the caller aggregate
        id: results
        run: |
          set -euo pipefail
          {
            printf 'results<<PRODUCTION_RESULTS_EOF\n'
            printf '%s\n' "$PRODUCTION_JOB_RESULTS"
            printf 'PRODUCTION_RESULTS_EOF\n'
          } >> "$GITHUB_OUTPUT"
