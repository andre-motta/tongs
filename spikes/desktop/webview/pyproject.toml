[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tongs-desktop-webview-prototype"
version = "0.0.1"
description = "Python-hosted desktop shell prototype for Tongs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pywebview>=6.2,<7",
    "QtPy>=2.4,<3",
]

[project.optional-dependencies]
pyside6 = ["PySide6>=6.8,<7"]

[project.scripts]
tongs-desktop-webview-prototype = "tongs_desktop_webview.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tongs_desktop_webview = [
    "_fixture_backend.py",
    "_build_manifest.json",
    "assets/*",
    "assets/frontend/**/*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
