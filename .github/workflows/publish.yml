name: Publish to PyPI

on:
  push:
    tags:
      # Stable releases only.  A filter pattern must match the whole ref, so
      # this admits v1.0.0 and refuses v1.0.0rc1, v1.0, and desktop-v1.0.0.
      # The tag is re-checked as an anchored regular expression below,
      # because the filter alone is not what gates the upload.
      - "v[0-9]+.[0-9]+.[0-9]+"

# The workflow-level default is read only.  Trusted publishing needs
# id-token: write, but only the publish job mints that token, so the build job
# must never be able to.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the release gate read main's ci.yml runs.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release gate.  Nothing is installed, built or uploaded unless the
      # tagged commit is on main, its release notes exist and main's ci.yml
      # push run on it is green.  This step is the only one that sees the
      # token, and it only reads two API responses into files.
      - name: Fetch main ancestry and main CI runs for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" \
            > "$RUNNER_TEMP/release-gate-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&per_page=100" \
            > "$RUNNER_TEMP/release-gate-runs.json"

      - name: Require the tag on main, its release notes and green main CI
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I .github/scripts/release_gate.py \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --compare "$RUNNER_TEMP/release-gate-compare.json" \
            --runs "$RUNNER_TEMP/release-gate-runs.json" \
            --notes "docs/releases/$GITHUB_REF_NAME.md"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The wheel and sdist built here are what the publish job uploads, so
      # the build frontend and backend come from the hash lock, and the build
      # runs without isolation so pip never resolves a fresh build backend.
      - name: Install the hash-locked build frontend and backend
        run: >-
          python -I -m pip install
          --isolated
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements/release.lock

      - name: Build package
        run: python -I -m build --no-isolation

      - name: Assert the built version equals the tag before anything is uploaded
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import email.parser
          import os
          import pathlib
          import re
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          shape = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if re.fullmatch(shape, tag) is None:
              raise SystemExit(f"refusing to publish from a non-release tag: {tag!r}")
          expected = tag[1:]

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              found = sorted(path.name for path in dist.iterdir())
              raise SystemExit(f"expected one wheel and one sdist, found {found}")

          wheel = wheels[0]
          distribution, filename_version = wheel.name.split("-")[:2]
          if filename_version != expected:
              raise SystemExit(
                  f"wheel {wheel.name!r} does not carry tag version {expected!r}"
              )

          with zipfile.ZipFile(wheel) as archive:
              names = [
                  name
                  for name in archive.namelist()
                  if re.fullmatch(r"[^/]+\.dist-info/METADATA", name)
              ]
              if len(names) != 1:
                  raise SystemExit("wheel does not carry exactly one METADATA")
              metadata = email.parser.BytesParser().parsebytes(archive.read(names[0]))

          if metadata["Version"] != expected:
              raise SystemExit(
                  f"wheel METADATA version {metadata['Version']!r} "
                  f"does not equal tag version {expected!r}"
              )

          if sdists[0].name != f"{distribution}-{expected}.tar.gz":
              raise SystemExit(
                  f"sdist {sdists[0].name!r} does not carry tag version {expected!r}"
              )

          print(f"tag {tag} matches the built version {expected}")
          CHECK

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
