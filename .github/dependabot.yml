# Monthly, grouped dependency update pull requests, tested by CI like any
# other change.  Per ecosystem, minor and patch updates arrive as one pull
# request and major updates as another, so a month brings at most two pull
# requests per ecosystem.
#
# No labels: ci.yml reruns on the labeled event (for ci:full), so the labels
# Dependabot adds after opening a pull request would start CI again and
# cancel the first run.
version: 2
updates:
  # Every action is pinned by commit SHA with a trailing "# vX.Y.Z" comment.
  # Dependabot updates the SHA and the comment together, which keeps the pin
  # contract in tests/ci/test_production_workflow_contract.py satisfied.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    groups:
      github-actions:
        update-types: [minor, patch]
      github-actions-major:
        update-types: [major]

  # pyproject.toml: the runtime ranges and the extras, including the exactly
  # pinned lint extra the CI lint job installs Ruff from.  The hash locks in
  # requirements/ are compiled by uv with --exclude-newer and are regenerated
  # by hand with the command at the top of each lock, so their .in inputs are
  # excluded: bumping an input without its lock would only break the lock.
  # Sigstore is updated by hand: the dev extra pins the exact version of
  # requirements/release.lock, which has to move with both .in files, the
  # locks and SIGSTORE_VERSION in release-desktop.yml in the same change.
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements/**
    schedule:
      interval: monthly
    labels: []
    ignore:
      - dependency-name: sigstore
    groups:
      python:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  # The desktop shell, the documentation site and the pinned Markdown linter
  # each install exactly from their own package-lock.json with npm ci.  Every
  # direct dependency is an exact version, and "increase" keeps it exact.
  # Electron is updated by hand: the reproducible desktop archive pins its
  # exact version and file digests in packaging/desktop/archive, which have to
  # be refreshed in the same change.
  - package-ecosystem: npm
    directories:
      - /desktop
      - /site
      - /.github/linters
    versioning-strategy: increase
    schedule:
      interval: monthly
    labels: []
    ignore:
      - dependency-name: electron
    groups:
      npm:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # The desktop formatter and linter (Prettier, ESLint and typescript-eslint)
  # install exactly from desktop/tools/lint/package-lock.json, apart from the
  # app's own toolchain.  typescript-eslint parses with a TypeScript it
  # supports, older than the app's, so TypeScript here takes patch updates
  # only and moves to a newer minor or major by hand once typescript-eslint's
  # peer range allows it.
  - package-ecosystem: npm
    directory: /desktop/tools/lint
    versioning-strategy: increase
    schedule:
      interval: monthly
    labels: []
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      desktop-lint:
        update-types: [minor, patch]
      desktop-lint-major:
        update-types: [major]
