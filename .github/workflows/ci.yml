name: CI

on:
  push:
    branches: [main, feat/desktop-app]
  pull_request:
    branches: [main, feat/desktop-app]

permissions:
  contents: read

env:
  # Every receipt-bearing job checks out and binds this exact revision.  For a
  # pull request that is GitHub's synthetic merge commit, because pre-merge
  # combination testing is how this initiative gates integration.  The pull
  # request head and base travel beside it as clearly named metadata, so
  # synthetic output is never labelled as a contributor-head result.
  TONGS_CHECKED_OUT_SHA: ${{ github.sha }}
  PULL_REQUEST_HEAD: >-
    ${{ github.event.pull_request.head.sha || 'not-a-pull-request' }}
  PULL_REQUEST_BASE: >-
    ${{ github.event.pull_request.base.sha || 'not-a-pull-request' }}
  PRODUCTION_ENVIRONMENT: github-hosted-ubuntu-24.04
  PRODUCTION_PROVENANCE: hosted

jobs:
  desktop-production:
    name: Desktop production evidence
    uses: ./.github/workflows/desktop-production.yml
    permissions:
      contents: read
      actions: read
    with:
      checked_out_sha: ${{ github.sha }}

  desktop-pr-gate:
    name: Desktop pre-merge aggregate
    if: ${{ always() }}
    needs:
      - desktop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      DESKTOP_GATE_RESULTS: ${{ toJSON(needs) }}
      DESKTOP_PRODUCTION_RESULTS: >-
        ${{ needs.desktop-production.outputs.job-results }}
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TONGS_CHECKED_OUT_SHA }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Record the checked-out revision and its pull request metadata
        id: identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TONGS_CHECKED_OUT_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$PULL_REQUEST_HEAD" != "$TONGS_CHECKED_OUT_SHA"
          fi
          {
            printf 'Event: %s\n\n' "$GITHUB_EVENT_NAME"
            printf 'Checked out commit: %s\n\n' "$TONGS_CHECKED_OUT_SHA"
            printf 'Checked out tree: %s\n\n' "$tree"
            printf 'Pull request head: %s\n\n' "$PULL_REQUEST_HEAD"
            printf 'Pull request base: %s\n\n' "$PULL_REQUEST_BASE"
            printf 'Reconstruct with: git checkout %s\n' "$TONGS_CHECKED_OUT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every desktop pre-merge job to succeed
        run: python3 tests/ci/verify_desktop_ci.py aggregate
      - name: Download the native payload fixture gate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            gate-desktop-native-payload-fixture-${{ env.TONGS_CHECKED_OUT_SHA }}-${{
            github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-evidence/desktop-native-payload-fixture
      - name: Require the complete production check set and every receipt
        run: >-
          python3 tests/ci/verify_desktop_production_gate.py
          --evidence-root "$RUNNER_TEMP/gate-evidence"
          --commit "$TONGS_CHECKED_OUT_SHA"
          --tree "${{ steps.identity.outputs.tree }}"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --environment "$PRODUCTION_ENVIRONMENT"
          --provenance "$PRODUCTION_PROVENANCE"
          --event "$GITHUB_EVENT_NAME"
          --pull-request-head "$PULL_REQUEST_HEAD"
          --pull-request-base "$PULL_REQUEST_BASE"
