name: Deploy docs

# Builds the Astro + Starlight site in site/ and deploys site/dist to GitHub
# Pages.  Pull requests get the same build, without a deploy, from the docs
# lane in ci.yml; tests/ci/test_production_workflow_contract.py keeps the two
# builds' commands identical.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job gets the Pages and OIDC scopes; the build job runs npm
# install scripts, so it keeps read-only contents access.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the locked site dependencies
        run: npm ci --prefix site
      # The build first fetches the tongs-agents docs pinned in
      # site/agents-docs.lock.json from codeload.github.com (sha256-checked)
      # for the /agents/ section, so this step needs that host.
      - name: Build the site with strict link validation
        run: npm run build --prefix site
      - name: Check the custom domain, the agents section and the repository-only records
        run: |
          set -euo pipefail
          grep -qx 'www.tongs.tools' site/dist/CNAME
          test -f site/dist/agents/index.html
          test -f site/dist/agents/tutorials/first-workspace/index.html
          for record in sdlc site-plan work agents/sdlc agents/work; do
            test ! -e "site/dist/$record"
          done
          if grep -qiE '/(sdlc|site-plan|work)/' site/dist/sitemap*.xml 2>/dev/null; then
            echo "A repository-only record reached the sitemap" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
