name: Desktop Podman probe

on:
  pull_request:
    branches: [feat/desktop-app]
    paths:
      - "tests/containers/**"
      - ".github/workflows/desktop-podman-probe.yml"

permissions:
  contents: read

jobs:
  fedora-44-x86-64:
    name: Fedora 44 x86_64 harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record hosted runner and Podman versions
        run: |
          uname -a
          podman version

      - name: Run Fedora 44 success probe
        run: |
          tests/containers/run-fedora-44.sh \
            --output-dir "$RUNNER_TEMP/tongs-fedora-44-success"

      - name: Assert deliberate harness failure returns nonzero
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          tests/containers/run-fedora-44.sh \
            --output-dir "$RUNNER_TEMP/tongs-fedora-44-failure" \
            --inject-failure
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "Deliberate failure probe unexpectedly returned success" >&2
            exit 1
          fi
          echo "Deliberate failure propagated with status $status as expected"

      - name: Upload Fedora 44 probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fedora-44-x86-64-podman-probe
          path: |
            ${{ runner.temp }}/tongs-fedora-44-success
            ${{ runner.temp }}/tongs-fedora-44-failure
          if-no-files-found: error
          retention-days: 14
