name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for tongs? We'd love to hear it. If you're unsure whether it fits, open a discussion first.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? How would you use it in your workflow?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How you think this could work. Sketches, keybinding ideas, and CLI examples are all welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they didn't fit.
    validations:
      required: false

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      description: Which interface would this feature live in?
      options:
        - Terminal interface (TUI)
        - MCP server plugin
        - Desktop workspace (unreleased, built from source)
        - Not interface-specific
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase would this most likely touch?
      options:
        - scanner
        - forges
        - tui
        - diff
        - cache
        - plugins
        - mcp
        - services
        - desktop
        - Not sure
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else (screenshots, mockups, links to similar features in other tools).
    validations:
      required: false
