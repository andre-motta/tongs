name: Desktop Podman probe

on:
  workflow_call:
    inputs:
      head_sha:
        description: Exact source revision recorded in the probe evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  fedora-44-x86-64:
    name: Fedora 44 x86_64 harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TONGS_HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record hosted runner and Podman versions
        run: |
          uname -a
          podman version
      - name: Run Fedora 44 success probe
        run: |
          tests/containers/run-fedora-44.sh \
            --output-dir "$RUNNER_TEMP/tongs-fedora-44-success"
      - name: Assert deliberate harness failure returns nonzero
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          tests/containers/run-fedora-44.sh \
            --output-dir "$RUNNER_TEMP/tongs-fedora-44-failure" \
            --inject-failure
          status=$?
          set -e
          python3 tests/containers/verify_expected_failure.py \
            --output-dir "$RUNNER_TEMP/tongs-fedora-44-failure" \
            --actual-status "$status"
      - name: Upload Fedora 44 probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            fedora-44-x86-64-podman-probe-${{ github.run_id }}-${{
            github.run_attempt }}
          path: |
            ${{ runner.temp }}/tongs-fedora-44-success
            ${{ runner.temp }}/tongs-fedora-44-failure
          if-no-files-found: error
          retention-days: 14
